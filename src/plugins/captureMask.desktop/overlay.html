<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <!--
        This page renders markup mirrored out of Discord, which contains other
        people's message content. It runs sandboxed with no node access, and the
        policy below denies everything except the styling and media the clone
        needs to look right. 'unsafe-inline' covers our own inline style block
        and Discord's style="" attributes; no remote script can load at all.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none';
        style-src 'unsafe-inline' https:;
        font-src https: data:;
        img-src https: data: blob:;
        media-src https: data: blob:;
        script-src 'unsafe-inline';">
    <title>CaptureMask</title>
    <!--
        Discord's stylesheets are inserted before this block at runtime, so the
        rules below always win the cascade against them.
    -->
    <style id="cm-own-css">
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
            /* The window is click-through at the OS level; this is belt and braces. */
            pointer-events: none;
            user-select: none;
        }

        /*
         * Everything inside is laid out in Discord's CSS pixels and scaled to
         * this window's pixels in one place. Doing it with a transform avoids
         * needing an Electron zoom API, which this build does not expose.
         */
        #cm-slots {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }

        /* Each mirrored target is parked at its counterpart's viewport rect. */
        .cm-slot {
            position: absolute;
            overflow: hidden;
            contain: layout paint style;
        }

        /* Referenced by the clone through url(#id); must never paint on its own. */
        #cm-defs {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
        }

        /*
         * The rebuilt ancestors exist only so Discord's descendant selectors
         * keep matching. display:contents drops their boxes entirely so they
         * cannot impose flex or grid layout on the clone.
         */
        [data-vc-cmask-chain] {
            display: contents !important;
        }

        /* The clone fills its slot regardless of what sized it in the real tree. */
        [data-vc-cmask-root] {
            position: absolute !important;
            inset: 0 !important;
            margin: 0 !important;
            max-width: none !important;
            max-height: none !important;
        }

        /*
         * Animations are snapped to their final frame rather than disabled.
         * Discord fades its message list in with a keyframe animation over a
         * base rule of opacity:0, so `animation: none` does not freeze those
         * messages — it deletes the only thing that ever made them visible, and
         * the un-animated loading skeleton shows through instead. Running every
         * animation to completion in 1ms lands on the finished state with no
         * flicker when a frame is replaced.
         */
        [data-vc-cmask-root] * {
            animation-duration: 1ms !important;
            animation-delay: 0s !important;
            animation-iteration-count: 1 !important;
            animation-fill-mode: forwards !important;
            transition: none !important;
        }

        /*
         * Discord's copied classes and inline styles may carry its own zoom or
         * transform. The rects we are given already account for those, so
         * honouring them here would scale everything twice.
         */
        html,
        body {
            zoom: 1 !important;
            transform: none !important;
            scale: none !important;
        }
    </style>
</head>

<body>
    <div id="cm-defs"></div>
    <div id="cm-slots"></div>
    <script>
        "use strict";

        const slots = document.getElementById("cm-slots");
        const defsNode = document.getElementById("cm-defs");
        const ownCss = document.getElementById("cm-own-css");

        let painted = 0;
        const report = info => window.__captureMask?.report?.(info);

        // Kept in step with SCROLLER_SELECTOR in mirror.ts so the offsets we
        // receive line up index-for-index with the elements here.
        const SCROLLER_SELECTOR = '[class*="scroller"]';

        const DROP_TAGS = new Set([
            "SCRIPT", "IFRAME", "OBJECT", "EMBED", "LINK", "BASE", "META", "NOSCRIPT", "FRAME", "FRAMESET"
        ]);
        const URL_ATTRS = ["href", "src", "xlink:href", "action", "formaction", "poster", "data"];

        /**
         * The mirrored markup is attacker-influenced: anyone who can DM you can
         * put text in it. React escapes it on the Discord side, but this page
         * inserts raw HTML, so strip anything executable before it lands.
         */
        function sanitise(root) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT);
            const doomed = [];

            for (let node = walker.currentNode; node; node = walker.nextNode()) {
                if (DROP_TAGS.has(node.tagName)) {
                    doomed.push(node);
                    continue;
                }

                for (const attr of Array.from(node.attributes)) {
                    const name = attr.name.toLowerCase();

                    if (name.startsWith("on")) {
                        node.removeAttribute(attr.name);
                        continue;
                    }

                    if (URL_ATTRS.includes(name)) {
                        const value = attr.value.trim().toLowerCase();
                        // eslint-disable-next-line no-script-url
                        if (value.startsWith("javascript:") || value.startsWith("vbscript:")) {
                            node.removeAttribute(attr.name);
                        }
                    }
                }
            }

            for (const node of doomed) node.remove();
            return root;
        }

        function parse(html) {
            // A detached document never runs scripts or fetches subresources,
            // so sanitising happens before anything can act on the markup.
            const doc = new DOMParser().parseFromString(`<body>${html}</body>`, "text/html");
            return sanitise(doc.body);
        }

        /*
         * Discord's CSS arrives as text in chunks rather than as <link> URLs:
         * this document's origin is opaque, so fetching those URLs from here is
         * refused, while the renderer that sent them is same-origin with
         * discord.com and can always read them. Chunking keeps any single IPC
         * message small — the whole stylesheet set is tens of megabytes.
         */
        let cssChunks = [];

        function applyCss() {
            for (const old of document.querySelectorAll(".cm-sheet")) old.remove();

            const style = document.createElement("style");
            style.className = "cm-sheet";
            style.textContent = cssChunks.join("");
            // Ahead of our own rules, so ours still win the cascade
            document.head.insertBefore(style, ownCss);

            report({ cssBytes: style.textContent.length });
            cssChunks = [];
        }

        function slotFor(id) {
            let slot = slots.querySelector(`[data-slot="${CSS.escape(id)}"]`);
            if (!slot) {
                slot = document.createElement("div");
                slot.className = "cm-slot";
                slot.dataset.slot = id;
                slots.appendChild(slot);
            }
            return slot;
        }

        function applyScroll(slot, offsets) {
            if (!offsets) return;

            const scrollers = slot.querySelectorAll(SCROLLER_SELECTOR);
            for (let i = 0; i < scrollers.length && i < offsets.length; i++) {
                scrollers[i].scrollTop = offsets[i];
            }
        }

        function handle(msg) {
            switch (msg.type) {
                case "css-chunk":
                    cssChunks.push(msg.text);
                    break;

                case "css-done":
                    applyCss();
                    report({ cssSheets: msg.sheets, cssFailed: msg.failed });
                    break;

                case "init": {

                    // Sanitised like any mirrored markup: these come from the
                    // same document and are equally untrusted.
                    if (msg.defs) defsNode.replaceChildren(...parse(msg.defs).childNodes);

                    const { chrome } = msg;
                    if (chrome) {
                        document.documentElement.className = chrome.htmlClass;
                        document.documentElement.setAttribute("style", chrome.htmlStyle);
                        document.body.className = chrome.bodyClass;
                        // Our own layout rules live in the stylesheet above, so the
                        // body's inline style can be adopted wholesale.
                        document.body.setAttribute("style", chrome.bodyStyle);
                    }
                    break;
                }

                case "frame": {
                    const { id, rect, html, scroll } = msg.frame;
                    const slot = slotFor(id);

                    slot.style.left = rect.x + "px";
                    slot.style.top = rect.y + "px";
                    slot.style.width = rect.width + "px";
                    slot.style.height = rect.height + "px";

                    slot.replaceChildren(...parse(html).childNodes);
                    applyScroll(slot, scroll);

                    painted++;
                    report({ painted, nodes: slot.querySelectorAll("*").length });
                    break;
                }

                case "scroll": {
                    const slot = slots.querySelector(`[data-slot="${CSS.escape(msg.update.id)}"]`);
                    if (slot) applyScroll(slot, msg.update.scroll);
                    break;
                }

                case "scale": {
                    // Discord's zoom, derived in the main process. Everything is
                    // positioned in Discord's CSS pixels, so one transform here
                    // aligns every slot at once.
                    slots.style.transform = `scale(${msg.value})`;
                    report({ scale: msg.value });
                    break;
                }

                case "drop": {
                    slots.querySelector(`[data-slot="${CSS.escape(msg.id)}"]`)?.remove();
                    break;
                }

                case "reset":
                    slots.replaceChildren();
                    break;
            }
        }

        // Proves the preload's context bridge survived. Without this the page
        // can never receive a frame, and the mirror stays blank forever.
        report({ bridge: Boolean(window.__captureMask) });

        window.__captureMask?.onMessage(msg => {
            try {
                handle(msg);
            } catch (err) {
                console.error("[CaptureMask] overlay failed to apply message", err);
                report({ lastError: String(err) });
            }
        });
    </script>
</body>

</html>
